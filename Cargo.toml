[workspace]
resolver = "2"
members = ["crates/pw-core", "crates/pw-pdf", "crates/pw-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kuyamcliff/pageweave"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "macros"] }
sha2 = "0.10"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe", "image_025"] }
lopdf = { version = "0.45", default-features = false }
# Both already in the dependency graph (pdfium-render / Tauri); pinned to those versions.
libloading = "=0.9.0"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
pw-core = { path = "crates/pw-core" }
pw-pdf = { path = "crates/pw-pdf" }

[workspace.lints.rust]
# Denied everywhere; the single audited exception is decision D-006 (enforced by a test).
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
