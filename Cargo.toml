[workspace]
resolver = "2"
members = ["crates/pw-core", "crates/pw-pdf", "crates/pw-ocr", "crates/pw-cli", "crates/pw-mcp", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kuyamcliff/pageweave"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "macros"] }
sha2 = "0.10"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe", "image_025"] }
lopdf = { version = "0.45", default-features = false }
# OS random source for encryption keys (already in the dependency graph via lopdf).
getrandom = "0.3"
# Strict zlib decode/encode for lossless recompression (already in the graph via lopdf).
flate2 = "1.1"
# Digital signature verification (RustCrypto, pure Rust; MIT/Apache-2.0).
cms = "0.2"
x509-cert = { version = "0.2", default-features = false }
der = { version = "0.7", features = ["alloc", "oid"] }
# Signing with a certificate: PKCS#12 (.pfx/.p12) reading and constant-time RSA/ECDSA signing.
p12-keystore = "0.4.1"
ring = "0.17.14"
# RSA verification is done locally with a big-integer modpow (public operations only): the rsa
# crate carries RUSTSEC-2023-0071 (D-011).
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha1 = "0.10"
# Myers diff for document comparison (Apache-2.0, no dependencies).
similar = { version = "2", default-features = false }
# XFDF form data reading (MIT; already in the dependency graph via Tauri). No DTD or entity expansion.
quick-xml = "=0.42.0"
# Word (.docx) packages: writing and verifying them (MIT). Deflate only, no other codecs or encryption.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
# Pattern search for redaction (MIT/Apache-2.0; already in the graph). Linear-time matching, no backtracking.
regex = { version = "1.13", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
# Both already in the dependency graph (pdfium-render / Tauri); pinned to those versions.
libloading = "=0.9.0"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4", features = ["derive"] }
pw-core = { path = "crates/pw-core" }
pw-pdf = { path = "crates/pw-pdf" }
pw-ocr = { path = "crates/pw-ocr" }
pw-mcp = { path = "crates/pw-mcp" }

[workspace.lints.rust]
# Denied everywhere; the single audited exception is decision D-006 (enforced by a test).
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
