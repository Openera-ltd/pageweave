name: CI

# Fails closed: every job must pass. See docs/QUALITY_GATES.md (Gates 2, 6) and PRD 13.
on:
  push:
    # Documentation-only commits cannot change build or test results; don't cancel a running CI for them.
    paths-ignore: ["docs/**", "prd/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan
        run: ./gitleaks git --redact --no-banner -v .

  deps:
    name: Dependency licenses and advisories (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  linux:
    name: Linux — fmt, clippy, unit/integration tests, UI tests, real-app E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (WebKitGTK, WebDriver, virtual display; LibreOffice for the Word round trip)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev webkit2gtk-driver xvfb \
            libreoffice-writer-nogui fonts-dejavu-core fonts-liberation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Fetch pinned PDFium (checksum verified)
        run: python3 -I tools/fetch_pdfium.py --platform linux-x64
      - name: Fetch pinned OCR runtime and models (checksum verified)
        run: python3 -I tools/fetch_ocr.py --platform linux-x64
      - name: Tool tests (watchdog decision logic)
        run: python3 -I -m unittest discover -s tools/tests -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ML workspace tests (corpus, scorer, rights gate, Kaggle safety)
        working-directory: ml
        run: |
          python -m pip install --quiet -r requirements-test.txt
          python -m unittest discover -s tests -t . -v
      - name: Fixtures are reproducible from the generator
        run: |
          python3 -I tools/fixtures/gen_fixtures.py
          git diff --exit-code -- fixtures/pdf ':!fixtures/pdf/encrypted-*'
      - name: UI install, typecheck, unit tests, production build
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx vitest run
          npx vite build
      - name: Interaction audit (every control has a handler/name; every command is tested; inventory is current)
        working-directory: app
        run: |
          node scripts/audit-controls.mjs --strict
          git diff --exit-code -- ../docs/INTERACTION_INVENTORY.md
      - name: Third-party license bundles are current (UI packages + Rust crates)
        run: |
          cargo install --locked cargo-about@0.9.2 --features cli
          cargo fetch --locked
          python3 -I tools/gen_licenses.py --check
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --no-fail-fast
      - name: Build the real app (embedded UI)
        working-directory: app
        run: npx tauri build --debug --no-bundle
      - name: Install tauri-driver
        run: cargo install --locked tauri-driver@2.1.0
      - name: Real-app end-to-end tests (WebDriver, virtual display)
        working-directory: app
        env:
          PAGEWEAVE_CLI: ${{ github.workspace }}/target/debug/pageweave
        run: ./e2e/run.sh ../target/debug/pageweave-app ../e2e-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux
          path: e2e-artifacts
          retention-days: 14

  windows:
    name: Windows — tests, installer build, install/launch/uninstall smoke, packaged CLI
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Fetch pinned PDFium (checksum verified)
        run: python -I tools/fetch_pdfium.py --platform win-x64
      - name: Fetch pinned OCR runtime and models (checksum verified)
        run: python -I tools/fetch_ocr.py --platform win-x64
      - name: UI install and build
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npx vitest run
          npx vite build
      - name: Tests
        # LibreOffice is not installed on the Windows runner; the Word round trip runs on Linux.
        env:
          PW_SKIP_SOFFICE: "1"
        run: cargo test --workspace --no-fail-fast
      - name: Build release CLI
        run: cargo build --release -p pw-cli
      - name: Assemble portable package (exe + engine + licenses only)
        run: |
          set -euo pipefail
          PKG=dist/pageweave-cli-windows-x64
          mkdir -p "$PKG/licenses"
          cp target/release/pageweave.exe "$PKG/"
          cp third_party/pdfium/win-x64/bin/pdfium.dll "$PKG/"
          mkdir -p "$PKG/ocr"
          cp third_party/ocr/win-x64/{onnxruntime.dll,det.onnx,rec.onnx,rec_dict.txt} "$PKG/ocr/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$PKG/"
          cp -r third_party/licenses/pdfium third_party/licenses/onnxruntime third_party/licenses/ppocr "$PKG/licenses/"
          ls -la "$PKG"
      - name: Smoke-test the package from a clean folder with no repo on the path
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf==6.17.0
          WORK="$RUNNER_TEMP/smoke dir ünïcode"
          mkdir -p "$WORK"
          cp -r dist/pageweave-cli-windows-x64 "$WORK/app"
          cp fixtures/pdf/five-pages.pdf "$WORK/in put.pdf"
          cd "$WORK"
          ./app/pageweave.exe --json capabilities
          # Installed resources match their pinned checksums in the package layout.
          ./app/pageweave.exe --json resources | tee resources.json
          python -I -c "import json; d=json.load(open('resources.json', encoding='utf-8')); assert d['ok'] and d['result']['all_ready'], d"
          ./app/pageweave.exe --json inspect "in put.pdf" | tee inspect.json
          python -I -c "import json; d=json.load(open('inspect.json', encoding='utf-8')); assert d['ok'] and d['result']['data']['page_count']==5, d"
          ./app/pageweave.exe extract --pages "2,4" -o "out put.pdf" "in put.pdf"
          python -I -c "import pypdf; r=pypdf.PdfReader('out put.pdf', strict=True); assert len(r.pages)==2; t=r.pages[1].extract_text(); assert 'PWMARK004' in t, t; print('independent check ok')"
          set +e; ./app/pageweave.exe extract --pages "2,4" -o "out put.pdf" "in put.pdf"; code=$?; set -e
          test "$code" = 8 || { echo "expected conflict exit 8, got $code"; exit 1; }
          # OCR from the package (runtime + models under ocr/), checked independently with pypdf.
          cp "$GITHUB_WORKSPACE/fixtures/pdf/scanned.pdf" "scan ned.pdf"
          ./app/pageweave.exe ocr --pages 1 -o "search able.pdf" "scan ned.pdf"
          python -I -c "import pypdf; t=pypdf.PdfReader('search able.pdf', strict=True).pages[0].extract_text(); assert 'Description' in t and 'Invoice' in t, t[:300]; print('OCR independent check ok')"
          mv app/ocr/rec.onnx app/rec.onnx.bak
          set +e; ./app/pageweave.exe ocr --pages 1 -o "x.pdf" "scan ned.pdf"; code=$?; set -e
          test "$code" = 10 || { echo "expected missing-resource exit 10 for OCR, got $code"; exit 1; }
          set +e; ./app/pageweave.exe resources; code=$?; set -e
          test "$code" = 10 || { echo "expected resources to report the missing model (exit 10), got $code"; exit 1; }
          mv app/rec.onnx.bak app/ocr/rec.onnx
          rm app/pdfium.dll
          set +e; ./app/pageweave.exe --json inspect "in put.pdf"; code=$?; set -e
          test "$code" = 10 || { echo "expected missing-engine exit 10, got $code"; exit 1; }
          echo "package smoke test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: pageweave-cli-windows-x64
          path: dist/pageweave-cli-windows-x64
          retention-days: 14

      - name: Build Windows installers (NSIS + MSI)
        working-directory: app
        run: npx tauri build
      - name: Install silently, launch, verify, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) $((Get-FileHash $setup.FullName).Hash)"
          $dir = Join-Path $env:RUNNER_TEMP "PageWeave Install"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          foreach ($f in @("pdfium.dll", "ocr/onnxruntime.dll", "ocr/det.onnx", "ocr/rec.onnx", "ocr/rec_dict.txt", "THIRD_PARTY_NOTICES.md", "licenses/pdfium/pdfium.txt", "licenses/onnxruntime/LICENSE.txt", "licenses/onnxruntime/ThirdPartyNotices.txt", "licenses/ppocr/Apache-2.0.txt", "licenses/ppocr/NOTICE.txt", "licenses/rust-crates.txt", "licenses/ui-npm.txt")) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "installed package is missing $f" }
          }
          $fixture = Join-Path $env:RUNNER_TEMP "smoke input.pdf"
          Copy-Item fixtures/pdf/five-pages.pdf $fixture
          $app = Start-Process -FilePath $exe.FullName -ArgumentList "`"$fixture`"" -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "app exited early with code $($app.ExitCode)" }
          $log = Get-ChildItem -Recurse "$env:LOCALAPPDATA\io.github.kuyamcliff.pageweave" -Filter pageweave.jsonl | Select-Object -First 1
          if (-not $log) { throw "no log file written" }
          $lines = Get-Content $log.FullName
          $lines | Write-Host
          if (-not ($lines | Select-String '"event":"startup"')) { throw "no startup event" }
          if (-not ($lines | Select-String '"event":"open".*"ok":true.*"pages":5')) { throw "document did not open in the installed app" }
          if ($lines | Select-String "smoke input") { throw "file name leaked into the log" }
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 2
          $un = Get-ChildItem $dir -Filter "uninstall*.exe" | Select-Object -First 1
          $u = Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait -PassThru
          Start-Sleep -Seconds 5
          if (Test-Path $exe.FullName) { throw "uninstall left the executable behind" }
          Write-Host "install/launch/open/uninstall smoke test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: pageweave-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          retention-days: 14

  windows-e2e:
    name: Windows — real-app E2E (WebView2 via Edge WebDriver)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Fetch pinned PDFium (checksum verified)
        run: python -I tools/fetch_pdfium.py --platform win-x64
      - name: Fetch pinned OCR runtime and models (checksum verified)
        run: python -I tools/fetch_ocr.py --platform win-x64
      - name: Build UI and the real app (embedded UI), plus CLI for independent checks
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npx vite build
          # Release build = the shipping configuration. (The debug build's web UI never loaded on the
          # Windows runner — no ui_ready mark, no DevTools — while the installed release app does.)
          npx tauri build --no-bundle
          cargo build --release -p pw-cli
          # Release builds look for the engine next to the executable only.
          cp ../third_party/pdfium/win-x64/bin/pdfium.dll ../target/release/
          mkdir -p ../target/release/ocr
          cp ../third_party/ocr/win-x64/{onnxruntime.dll,det.onnx,rec.onnx,rec_dict.txt} ../target/release/ocr/
      - name: Install tauri-driver
        run: cargo install --locked tauri-driver@2.1.0
      # Every WebDriver session timed out on the first Windows runs. This bounded step records whether
      # the app's WebView2 exposes DevTools when asked, whether the app logged its startup, and what
      # Edge WebDriver itself does with the capabilities tauri-driver sends (verbose log uploaded).
      - name: Diagnose WebView2 automation (bounded, informational)
        shell: pwsh
        working-directory: app
        timeout-minutes: 4
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force ..\e2e-artifacts-windows | Out-Null
          $app = (Resolve-Path ..\target\release\pageweave-app.exe).Path
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9333"
          $p = Start-Process $app -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) { try { $r = Invoke-WebRequest http://127.0.0.1:9333/json/version -UseBasicParsing -TimeoutSec 2; "DevTools reachable: $($r.Content)"; $ok = $true; break } catch { Start-Sleep -Milliseconds 500 } }
          if (-not $ok) { "DevTools endpoint NOT reachable after 20 s" }
          "App still running: $(-not $p.HasExited)"
          # Did the WebView2 browser process receive the debugging flag? Are policies blocking it?
          Get-CimInstance Win32_Process -Filter "name='msedgewebview2.exe'" | Where-Object { $_.CommandLine -notmatch '--type=' } | ForEach-Object { "WebView2 browser process: $($_.CommandLine)" }
          foreach ($k in "HKLM:\SOFTWARE\Policies\Microsoft\Edge", "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2", "HKCU:\SOFTWARE\Policies\Microsoft\Edge") {
            if (Test-Path $k) { "Policy key ${k}:"; Get-ItemProperty $k | Format-List | Out-String }
          }
          Get-ChildItem "$env:LOCALAPPDATA\io.github.kuyamcliff.pageweave\logs\*.jsonl" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 10 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Remove-Item Env:\WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          $edge = Join-Path $env:EDGEWEBDRIVER "msedgedriver.exe"
          $log = (Join-Path (Resolve-Path ..\e2e-artifacts-windows) "msedgedriver-diag.log")
          $d = Start-Process $edge -ArgumentList "--port=9515", "--verbose", "--log-path=$log" -PassThru
          Start-Sleep -Seconds 2
          $fixture = (Resolve-Path ..\fixtures\pdf\five-pages.pdf).Path
          $caps = @{ capabilities = @{ alwaysMatch = @{ browserName = "webview2"; "ms:edgeChromium" = $true; "ms:edgeOptions" = @{ binary = $app; args = @($fixture) } } } } | ConvertTo-Json -Depth 6
          try {
            $sess = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:9515/session -Body $caps -ContentType "application/json" -TimeoutSec 60
            "Native Edge WebDriver session OK: $($sess.value.sessionId)"
            Start-Sleep -Seconds 5
            # What did the driver actually pass to the app, and did the app open the file?
            Get-CimInstance Win32_Process -Filter "name='pageweave-app.exe'" | ForEach-Object { "App command line under the driver: $($_.CommandLine)" }
            Get-ChildItem "$env:LOCALAPPDATA\io.github.kuyamcliff.pageweave\logs\*.jsonl" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 6 }
            $url = Invoke-RestMethod -Method Get -Uri "http://127.0.0.1:9515/session/$($sess.value.sessionId)/url" -TimeoutSec 20
            "Page URL under the driver: $($url.value)"
            Invoke-RestMethod -Method Delete -Uri "http://127.0.0.1:9515/session/$($sess.value.sessionId)" -TimeoutSec 20 | Out-Null
          } catch { "Native Edge WebDriver session FAILED: $_" }
          Stop-Process -Id $d.Id -Force -ErrorAction SilentlyContinue
          Get-Process pageweave-app -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $log) { Get-Content $log -Tail 40 }
      - name: Real-app end-to-end tests on Windows
        shell: pwsh
        working-directory: app
        env:
          PAGEWEAVE_CLI: ${{ github.workspace }}\target\release\pageweave.exe
        run: |
          $ErrorActionPreference = "Stop"
          $edge = Join-Path $env:EDGEWEBDRIVER "msedgedriver.exe"
          if (-not (Test-Path $edge)) { throw "Edge WebDriver not found at $edge" }
          & $edge --version
          (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue).pv | ForEach-Object { "WebView2 runtime: $_" }
          New-Item -ItemType Directory -Force ..\e2e-artifacts-windows | Out-Null
          $drv = Start-Process tauri-driver -ArgumentList "--port", "4444", "--native-driver", "`"$edge`"" -PassThru -RedirectStandardOutput ..\e2e-artifacts-windows\tauri-driver.out.log -RedirectStandardError ..\e2e-artifacts-windows\tauri-driver.err.log
          for ($i = 0; $i -lt 50; $i++) { try { Invoke-WebRequest http://127.0.0.1:4444/status -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Milliseconds 200 } }
          node e2e/run.mjs ..\target\release\pageweave-app.exe ..\e2e-artifacts-windows
          $code = $LASTEXITCODE
          Stop-Process -Id $drv.Id -Force -ErrorAction SilentlyContinue
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows
          path: e2e-artifacts-windows
          retention-days: 14
