name: Offline installer

# Builds the complete Windows installer for offline use and proves it works from a clean install:
#   PageWeave_<v>_x64-offline-setup.exe — the app and the command-line tool (pageweave.exe), the PDF
#   engine, text recognition, every translation language (30 directions), LibreOffice for Office
#   files (its pinned package, unpacked on the user's machine by the installer) and the WebView2
#   runtime (offline installer), so nothing is downloaded at install or first use. Unlike Release (release.yml) it needs no signing secrets: the build is NOT code-signed and
#   has no update key, so Windows SmartScreen warns on first run and the app cannot update itself.
#
# Runs when this file changes on a push, for tags offline-*, or from the Actions tab.
on:
  push:
    branches: ["**"]
    tags: ["offline-*"]
    # Branch pushes: only when this workflow changes (tag pushes ignore paths).
    paths: [".github/workflows/offline-installer.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build, install offline, verify, uninstall (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Version
        run: |
          V=$(python -I -c "import json; print(json.load(open('app/src-tauri/tauri.conf.json'))['version'])")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "PageWeave $V at ${GITHUB_SHA::7}"
      - name: Fetch pinned PDFium (checksum verified)
        run: python -I tools/fetch_pdfium.py --platform win-x64
      - name: Fetch pinned OCR runtime and models (checksum verified)
        run: python -I tools/fetch_ocr.py --platform win-x64
      - name: Cache pinned translation models
        uses: actions/cache@v4
        with:
          path: third_party/translate
          key: translate-${{ hashFiles('resources/translate.lock.json') }}
      - name: Fetch pinned translation models (checksum verified)
        run: python -I tools/fetch_translate.py
      - name: Cache the pinned LibreOffice package
        uses: actions/cache@v4
        with:
          path: office-msi
          key: office-${{ hashFiles('resources/office.lock.json') }}
      - name: Stage the pinned LibreOffice package (checksum verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lock = Get-Content resources/office.lock.json | ConvertFrom-Json
          $w = $lock.windows_x64
          New-Item -ItemType Directory -Force office-msi | Out-Null
          $name = "LibreOffice_$($lock.version).msi"
          $msi = Join-Path (Resolve-Path office-msi) $name
          if (-not (Test-Path $msi) -or (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower() -ne $w.sha256) {
            for ($i = 1; $i -le 4; $i++) { try { Invoke-WebRequest $w.url -OutFile $msi -UseBasicParsing; break } catch { if ($i -eq 4) { throw }; Start-Sleep -Seconds (2 * $i) } }
          }
          if ((Get-FileHash $msi -Algorithm SHA256).Hash.ToLower() -ne $w.sha256) { throw "LibreOffice package checksum mismatch" }
          # The installer carries the package itself (an unpacked copy would exceed the 2 GB an NSIS
          # installer can hold); its post-install hook unpacks it with the bundled CLI (hooks.nsh).
          $dest = Join-Path (Get-Location) "third_party\office-package"
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $msi (Join-Path $dest $name)
          "{0:N0} MB package staged" -f ((Get-Item (Join-Path $dest $name)).Length / 1MB)
      - name: UI install and unit tests
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npx vitest run
      - name: Build the command-line tool (bundled into the installer)
        run: cargo build --release -p pw-cli
      - name: Build the offline installer
        working-directory: app
        run: |
          set -euo pipefail
          npx tauri build --bundles nsis --config src-tauri/tauri.full.conf.json
          mkdir -p ../dist
          OUT="../dist/PageWeave_${VERSION}_x64-offline-setup.exe"
          mv "../target/release/bundle/nsis/PageWeave_${VERSION}_x64-setup.exe" "$OUT"
          (cd ../dist && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          ls -la ../dist
          cat ../dist/*.sha256
      - name: Install silently, then verify everything works from the installed copy
        timeout-minutes: 40
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem dist/*-offline-setup.exe | Select-Object -First 1
          "installer {0} ({1:N0} MB)" -f $setup.Name, ($setup.Length / 1MB)
          $dir = Join-Path $env:RUNNER_TEMP "PageWeave Offline"
          $data = Join-Path $env:LOCALAPPDATA "io.github.kuyamcliff.pageweave"
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          # Program folder: app, CLI, engine, text recognition, notices.
          foreach ($f in @("pageweave-app.exe", "pageweave.exe", "pdfium.dll", "ocr/onnxruntime.dll", "ocr/det.onnx", "ocr/rec.onnx", "THIRD_PARTY_NOTICES.md")) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "installed package is missing $f" }
          }
          # The languages were moved to the user's data folder and LibreOffice was unpacked there from
          # the bundled package by the installer (D-023, D-026); the package is gone afterwards.
          if (-not (Test-Path (Join-Path $data "translate"))) { throw "translation models not installed" }
          $soffice = Get-ChildItem (Join-Path $data "office") -Recurse -Filter soffice.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $soffice) { Get-ChildItem $data | Format-Table Name, Length | Out-String | Write-Host; throw "LibreOffice not unpacked by the installer" }
          if (Get-ChildItem $data -Filter "LibreOffice_*.msi") { throw "the LibreOffice package was left in the data folder" }
          # PageWeave reads LibreOffice's version from this file instead of running soffice --version,
          # which on Windows shows a message box when there is no console (the installer hung on it).
          Get-Content (Join-Path $soffice.DirectoryName "version.ini") -TotalCount 15 | Write-Host
          if (Test-Path (Join-Path $dir "office-package")) { throw "the LibreOffice package was left in the program folder" }
          "{0:N0} MB in the data folder" -f ((Get-ChildItem $data -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          $cli = Join-Path $dir "pageweave.exe"
          $work = Join-Path $env:RUNNER_TEMP "offline check"
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item fixtures/pdf/five-pages.pdf (Join-Path $work "in.pdf")
          Copy-Item fixtures/pdf/scanned.pdf (Join-Path $work "scan.pdf")
          # Every resource is present and matches its pinned checksum.
          & $cli --json resources | Tee-Object -FilePath (Join-Path $work "resources.json")
          if ($LASTEXITCODE -ne 0) { throw "resources not all ready ($LASTEXITCODE)" }
          # Translation with the bundled models: no download (the models folder is the installed one).
          & $cli --json translate --pages 1 --from en --to de -o (Join-Path $work "de.txt") (Join-Path $work "in.pdf")
          if ($LASTEXITCODE -ne 0) { throw "translation failed ($LASTEXITCODE)" }
          if (-not ((Get-Content (Join-Path $work "de.txt") -Raw) -match "PWMARK001")) { throw "translation output unexpected" }
          # Text recognition.
          & $cli ocr --pages 1 -o (Join-Path $work "ocr.pdf") (Join-Path $work "scan.pdf")
          if ($LASTEXITCODE -ne 0) { throw "OCR failed ($LASTEXITCODE)" }
          # Office files through the bundled LibreOffice.
          Set-Content -Path (Join-Path $work "sheet.csv") -Value "Item,Amount`nPWOFFICE,42"
          & $cli office
          & $cli from-office -o (Join-Path $work "sheet.pdf") (Join-Path $work "sheet.csv")
          if ($LASTEXITCODE -ne 0) { throw "Office conversion failed ($LASTEXITCODE)" }
          $t = & $cli --json text (Join-Path $work "sheet.pdf")
          if (-not ("$t" -match "PWOFFICE")) { throw "converted PDF lacks the text" }
          # The desktop app starts and opens a document.
          $app = Start-Process -FilePath (Join-Path $dir "pageweave-app.exe") -ArgumentList "`"$(Join-Path $work 'in.pdf')`"" -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) { throw "app exited early with code $($app.ExitCode)" }
          $log = Get-ChildItem -Recurse $data -Filter pageweave.jsonl | Select-Object -First 1
          if (-not $log) { throw "no log file written" }
          $lines = Get-Content $log.FullName
          if (-not ($lines | Select-String '"event":"open".*"ok":true.*"pages":5')) { $lines | Write-Host; throw "document did not open in the installed app" }
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 3
          # Uninstall removes the program.
          $un = Get-ChildItem $dir -Filter "uninstall*.exe" | Select-Object -First 1
          Start-Process -FilePath $un.FullName -ArgumentList "/S" -Wait | Out-Null
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir "pageweave-app.exe")) { throw "uninstall left the app behind" }
          Write-Host "offline installer verified: install, resources, translation, OCR, Office, app start, uninstall"
      - uses: actions/upload-artifact@v4
        with:
          name: PageWeave-${{ env.VERSION }}-windows-x64-offline-setup
          path: |
            dist/*-offline-setup.exe
            dist/*.sha256
          retention-days: 30
          compression-level: 0
