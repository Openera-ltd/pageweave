[package]
name = "pw-speech"
description = "PageWeave speech: read aloud with the system's voices and timings for highlighting (decision D-021)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pw-core.workspace = true
serde.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
# Already in the dependency graph via Tauri/WebView2 (same version): WinRT speech synthesis.
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Core",
  "Media_SpeechSynthesis",
  "Storage_Streams",
] }

[lints]
workspace = true
