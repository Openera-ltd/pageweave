[package]
name = "pw-net"
description = "PageWeave downloads: HTTPS with the system's certificates, resume, size and SHA-256 checks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pw-core.workspace = true
sha2.workspace = true
# HTTPS with the operating system's certificate store (no bundled root list).
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
