# cargo-deny policy (PRD 11/16: dependency license, advisory and source checks). CI fails closed.

[graph]
all-features = false
# Only the platforms PageWeave builds for. (rustls-platform-verifier's wasm32-only root list,
# webpki-root-certs, is CDLA-Permissive-2.0 and never compiled for these targets.)
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
# Fail on any vulnerability or unsound advisory; unmaintained crates are reported for review.
yanked = "deny"
# Each ignore is narrow, justified and reviewed; vulnerabilities are never ignored here.
ignore = [
    # proc-macro-error is unmaintained (not vulnerable). Compile-time only, reached solely through
    # Tauri's Linux GTK stack (glib-macros); absent from the Windows build. Revisit when Tauri's
    # Linux dependencies move off it. Reviewed 2026-10-16.
    { id = "RUSTSEC-2024-0370", reason = "unmaintained compile-time macro via Tauri Linux GTK deps; not in Windows build" },
    # zbus_names / zvariant / zvariant_derive are unmaintained as standalone crates (merged into
    # zbus 6); not vulnerable. Reached only through tauri-plugin-opener 2.x's Linux D-Bus support
    # (`cargo tree --target x86_64-pc-windows-msvc -i zvariant` prints nothing); no stable
    # tauri-plugin-opener uses zbus 6 yet (only 3.0.0-alpha). Advisories published 2026-10-17.
    # Revisit when tauri-plugin-opener 3 is stable. Reviewed 2026-10-17.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained (merged into zbus 6) via tauri-plugin-opener Linux D-Bus; not in Windows build; no stable upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained (merged into zbus 6) via tauri-plugin-opener Linux D-Bus; not in Windows build; no stable upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained (merged into zbus 6) via tauri-plugin-opener Linux D-Bus; not in Windows build; no stable upgrade" },
]

[licenses]
# Licenses compatible with distributing PageWeave under MIT. Anything else fails CI until reviewed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
